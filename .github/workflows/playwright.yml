name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_COUNTRY: ${{ secrets.TEST_COUNTRY }}
      TEST_PRODUCT: ${{ secrets.TEST_PRODUCT }}
      TEST_PRODUCT_2: ${{ secrets.TEST_PRODUCT_2 }}
      TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      WEB_ORDER_URL: ${{ secrets.WEB_ORDER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
        timeout-minutes: 10

      - name: Install browser deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        timeout-minutes: 10

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30