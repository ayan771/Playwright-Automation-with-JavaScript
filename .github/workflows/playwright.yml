name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_COUNTRY: ${{ secrets.TEST_COUNTRY }}
      TEST_PRODUCT: ${{ secrets.TEST_PRODUCT }}
      TEST_PRODUCT_2: ${{ secrets.TEST_PRODUCT_2 }}
      TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      WEB_ORDER_URL: ${{ secrets.WEB_ORDER_URL }}
      
      
      
